[project]
name          = "varco-fastapi"
version       = "3.2.0"
description   = "FastAPI adapter for varco — routing, auth middleware, job running, typed HTTP client, and DI wiring"
authors       = [{ name = "edoardo.scarpaci", email = "edoardo.scarpaci@gmail.com" }]
readme        = "README.md"
license       = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords      = ["fastapi", "async", "rest-api", "domain-model", "varco", "middleware", "auth", "jobs"]
classifiers   = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    # Workspace sibling — resolved from the monorepo via the tool.uv.sources table below.
    "varco-core~=3.0",
    # FastAPI provides the HTTP framework, routing, and OpenAPI schema generation.
    "fastapi>=0.115.0",
    # httpx is the async HTTP client used by AsyncVarcoClient and SyncVarcoClient.
    "httpx>=0.27.0",
    # pydantic-settings for env-var-based configuration (CORSConfig, TrustStore, etc.)
    "pydantic-settings>=2.14.2",
    # providify for DI wiring (@Configuration, @Provider, Inject[], DIContainer)
    "providify>=2.0.1",
    # python-multipart is required for FastAPI form data parsing (file uploads, etc.)
    "python-multipart>=0.0.31",
    # typing-extensions provides PEP 696 TypeVar(default=...) on Python 3.12
    # (native only from 3.13) — used for VarcoCRUDRouter's 6th `S` TypeVar.
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
# WebSocket and SSE support (requires varco_ws from the workspace)
ws  = ["varco-ws~=3.0"]
# MCP (Model Context Protocol) adapter support
# Enables MCPAdapter.to_mcp_server() and MCPAdapter.mount()
# Bumped to `>=2,<3` (Plan 029 / N1a, §D-N1-pin, research brief 003): `pip
# install mcp` already resolves to the v2 line (brief 003 §1) and v1.x is
# maintenance-only (security fixes alone) — the old `<2` pin protected
# nobody, it only stranded users on an abandoned branch. `to_mcp_server()`
# now builds `mcp.server.Server(name=..., on_list_tools=..., on_call_tool=...)`
# (constructor-based handler registration) instead of the v1 low-level
# `Server` + `@server.list_tools()`/`@server.call_tool()` decorator pair —
# the migration this pin bump enables is §D-N1-rewrite. Dual v1/v2 support
# was evaluated and rejected (§D-N1-pin): registration is structurally
# different between the two lines, so one codebase cannot cleanly serve
# both, and the ecosystem precedent (IBM mcp-context-forge,
# langchain-mcp-adapters) is "pin, then migrate wholesale" — exactly this.
# BREAKING (optional extra) — see CHANGELOG.
mcp = ["mcp>=2,<3"]
# A2A (Agent-to-Agent / Google A2A protocol) support
# SkillAdapter works without this extra (it uses FastAPI directly);
# install for the google-a2a SDK types if you need A2A client utilities.
a2a = []
# OpenTelemetry instrumentation — optional; gracefully no-ops when absent
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
]
# Prometheus scrape endpoint support (GET /metrics in Prometheus text / OpenMetrics format)
# Enables MetricsRouter and OtelConfiguration PrometheusMetricReader.
# Both OTLP push and Prometheus pull can be active simultaneously when combined
# with OtelConfig(prometheus_enabled=True, otlp_endpoint="http://...").
prometheus = [
    "opentelemetry-exporter-prometheus>=0.43b0",
]
# OpenAPI client support — YAML spec parsing (JSON is built-in)
# Install with: pip install 'varco-fastapi[openapi]'
openapi = ["pyyaml>=6.0"]

[project.scripts]
varco-gen = "varco_fastapi.client.openapi_gen:main"

[project.entry-points."varco.commands"]
fastapi = "varco_fastapi.contract.cli:register"

[project.urls]
Homepage   = "https://github.com/edoardoscarpaci/varco"
Repository = "https://github.com/edoardoscarpaci/varco/tree/main/varco_fastapi"
Issues     = "https://github.com/edoardoscarpaci/varco/issues"

[tool.uv.sources]
# Resolve workspace siblings from the monorepo instead of PyPI.
varco-core = { workspace = true }
varco-ws   = { workspace = true }
# Dev-only, test-time sibling — see the varco-sa dev-group entry below for why
# this does not violate "varco_fastapi imports only varco_core.migration".
varco-sa   = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # httpx is used as a test client via fastapi.testclient.TestClient + AsyncClient
    "httpx>=0.27.0",
    # uvicorn for integration test server
    "uvicorn>=0.30",
    # starlette test client
    "anyio>=4.0",
    # cryptography for JWT auth tests
    "cryptography>=50.0.0",
    # tests/test_app_migrations_integration.py exercises MigrationLifecycle against a
    # real AlembicMigrator + Postgres to prove the varco_core.migration contract end to
    # end. varco_fastapi/varco_fastapi/** still imports ONLY varco_core.migration at
    # runtime (the layer rule in CLAUDE.md) — this is a dev-group, test-only
    # dependency, never a [project] dependency, and never reaches the wheel.
    "varco-sa",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "testcontainers[postgres]>=4.0",
]

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varco_fastapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
pythonpath   = ["../testkit"]
markers      = [
    "integration: real external services required (disabled by default — use -m integration)",
    "chaos: kills/pauses/restarts a real container; excluded from -m integration by default — use make chaos-test",
]
filterwarnings = [
    "ignore::DeprecationWarning:httpx",
    "ignore::DeprecationWarning:jwt",
    "ignore::DeprecationWarning:starlette",
    "ignore::DeprecationWarning:pydantic",
]
