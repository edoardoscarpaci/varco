[project]
name          = "varco-sa"
version       = "3.2.0"
description   = "SQLAlchemy async backend for varco — runtime ORM generation, repository, schema guard, and Alembic helpers"
authors       = [{ name = "edoardo.scarpaci", email = "edoardo.scarpaci@gmail.com" }]
readme        = "README.md"
license       = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords      = ["fastapi", "sqlalchemy", "async", "domain-model", "repository", "alembic", "orm", "schema-guard"]
classifiers   = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Database",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    # Workspace sibling — resolved from the monorepo via the tool.uv.sources table below.
    "varco-core~=3.0",
    "sqlalchemy[asyncio]>=2.0",
    "providify>=2.0.1",
]

[project.urls]
Homepage   = "https://github.com/edoardoscarpaci/varco"
Repository = "https://github.com/edoardoscarpaci/varco/tree/main/varco_sa"
Issues     = "https://github.com/edoardoscarpaci/varco/issues"

[tool.uv.sources]
varco-core = { workspace = true }
# Dev-only, test-time sibling (see the varco-redis dev-group entry above).
varco-redis = { workspace = true }

[project.optional-dependencies]
# Install with: uv sync --extra postgresql
postgresql = ["asyncpg>=0.29"]
# Install with: uv sync --extra migrations (or `pip install "varco-sa[migrations]"`)
migrations = ["alembic>=1.13"]

[dependency-groups]
dev = [
    # aiosqlite is included here (not just sqlite group) so tests run without
    # needing a separate --extra flag during local development.
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # C-8: tests/conftest.py:90-127, tests/test_rls.py, tests/test_migration_lock.py and
    # ~10 other files use PostgresContainer + postgresql+asyncpg:// DSNs but this dev
    # group previously declared neither dependency — both only resolved because a
    # sibling package's dev group leaked into the shared workspace venv. Declare them
    # explicitly so `uv sync --package varco-sa` in isolation doesn't break 10 test files.
    "testcontainers[postgres]>=4.0",
    "asyncpg>=0.29",
    # Plan 012 / RT7, Step 28: test_outbox_chaos_integration.py drives a real
    # OutboxRelay against a real broker (Redis) alongside real Postgres to
    # prove durability under a mid-drain broker restart. Dev-only, test-time
    # — varco_sa/varco_sa/** never imports varco_redis.
    "varco-redis",
    "testcontainers[redis]>=4.0",
]

[project.entry-points."varco.commands"]
sa = "varco_sa.migration.cli:register"

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varco_sa"]
# The framework Alembic branch's revision files (Plan 006, step 25) ship
# automatically because `varco_sa/migrations/` is a regular subdirectory of
# the `varco_sa` package — `packages = ["varco_sa"]` already includes it
# recursively. No force-include/artifacts entry is needed (and one would
# conflict — hatchling refuses to add the same path to the wheel twice).
# Verified in CI via: uv build && unzip -l dist/varco_sa-*.whl | grep migrations/versions

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
pythonpath   = ["../testkit"]
markers      = [
    "integration: requires external services (Docker); skipped by default — use -m integration to run",
    "chaos: kills/pauses/restarts a real container; excluded from -m integration by default — use make chaos-test",
]
filterwarnings = [
    "ignore::DeprecationWarning:httpx",
    "ignore::DeprecationWarning:jwt",
    "ignore::DeprecationWarning:starlette",
    "ignore::DeprecationWarning:pydantic",
]
