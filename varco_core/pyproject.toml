[project]
name          = "varco-core"
version       = "3.2.0"
description   = "Backend-agnostic domain model, service layer, authorization, query AST and DTOs for varco"
authors       = [{ name = "edoardo.scarpaci", email = "edoardo.scarpaci@gmail.com" }]
readme        = "README.md"
license       = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords      = ["fastapi", "domain-model", "service-layer", "async", "rest-api", "orm-agnostic", "query-builder", "jwt", "authorization"]
classifiers   = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Database",
    "Framework :: FastAPI",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12.5,<3.0.0",
    # pydantic-settings provides BaseSettings — used by VarcoSettings and all
    # backend config classes (RedisEventBusSettings, KafkaEventBusSettings, etc.)
    # to read configuration from environment variables automatically.
    "pydantic-settings>=2.14.2",
    "providify>=2.0.1",
    # lark is used by QueryParser — runtime dependency, not dev-only
    "lark>=1.1",
    # PyJWT is used by varco_core.jwt for encoding/decoding JWT tokens
    "PyJWT>=2.8,<3.0",
    # cryptography is used by varco_core.jwk for RSA/EC key operations
    "cryptography>=50.0.0",
    # opentelemetry-api + sdk + OTLP exporter — used by varco_core.observability
    # for @span, @counter, @histogram decorators and OtelConfiguration DI module.
    # The SDK and OTLP exporter are required (not just the API) because
    # OtelConfiguration builds TracerProvider / MeterProvider from the SDK and
    # attaches the OTLP gRPC exporter when an endpoint is configured.
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
    # psutil is used by varco_core.profiling for RSS memory delta tracking
    # and is available as a convenience export via register_gauge in observability.
    "psutil>=5.9",
]

[project.optional-dependencies]
# Plan 011 / T1 — most deployments already have system tzdata; slim
# container images (python:*-slim, distroless, Alpine) frequently do not.
# `zoneinfo` falls back to the PyPI `tzdata` package when the OS database is
# absent — installed only via this extra, never a hard dependency.
tz = [
    "tzdata>=2024.1; sys_platform == 'win32' or sys_platform == 'linux'",
]
# Plan 025 / T1b — opt-in, not a hard dependency: StatPollWatcher (stdlib-only) is the
# default AbstractPathWatcher implementation, correct on NFS and Docker bind mounts where
# inotify never fires (locked decision, BACKLOG.md:34, research brief 001 §1). watchfiles
# is for callers who want lower dev-loop latency on a local, non-networked filesystem.
# Floor 1.2.0 per brief 001's version table: Python 3.10+, Rust `notify` backend, the same
# library uvicorn's `--reload` uses.
watch = [
    "watchfiles>=1.2.0",
]

[project.urls]
Homepage   = "https://github.com/edoardoscarpaci/varco"
Repository = "https://github.com/edoardoscarpaci/varco/tree/main/varco_core"
Issues     = "https://github.com/edoardoscarpaci/varco/issues"

[project.scripts]
varco = "varco_core.cli.main:main"

# Plan 022 §D-AA4 / RS-3 reserved the `export-asyncapi` verb in this group.
# It is contributed through the entry-point group rather than hard-wired into
# `cli/main.py`'s built-in list, exactly as `varco_sa`/`varco_beanie`/
# `varco_fastapi` contribute theirs — so the dispatch mechanism has one shape,
# and the verb stays discoverable by `importlib.metadata` alone.
[project.entry-points."varco.commands"]
export-asyncapi = "varco_core.cli.asyncapi:register"

[tool.uv.sources]
# varco-fastapi is a dev-only, test-time dependency (see the comment below) — this
# does not create a runtime/published dependency cycle: varco_core's own
# [project] dependencies never reference it, and varco_core/varco_core/** never
# imports it. Same rationale as varco_fastapi's dev-group dependency on varco-sa
# (Step 35 of plans/012-r3-reliability-and-regression-proofing.md).
varco-fastapi = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # tests/test_conformance_inmemory.py imports InMemoryJobStore from
    # varco_fastapi.job.store to exercise the shared JobStoreConformance suite
    # against the in-process job store — the only concrete AbstractJobStore
    # implementation that lives outside a container-requiring backend package.
    # Dev-only: never a runtime/published dependency of varco_core.
    "varco-fastapi",
]

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varco_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
pythonpath   = ["../testkit"]
markers      = [
    "integration: requires external services (Docker); skipped by default — use -m integration to run",
]
filterwarnings = [
    "ignore::DeprecationWarning:httpx",
    "ignore::DeprecationWarning:jwt",
    "ignore::DeprecationWarning:starlette",
    "ignore::DeprecationWarning:pydantic",
]
