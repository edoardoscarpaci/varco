[project]
name          = "varco-casbin"
version       = "3.2.0"
description   = "Casbin policy-engine authorization backend for varco — ACL/RBAC/ABAC with dynamic persisted policies and a REST management router"
authors       = [{ name = "edoardo.scarpaci", email = "edoardo.scarpaci@gmail.com" }]
readme        = "README.md"
license       = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords      = ["fastapi", "casbin", "authorization", "rbac", "abac", "acl", "policy", "varco"]
classifiers   = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "varco-core~=3.0",
    "casbin>=1.36",
    "providify>=2.0.1",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
# REST management router (CasbinPolicyRouter) — pulls in the FastAPI layer.
fastapi = ["varco-fastapi~=3.0"]
# Durable, dynamic-CRUD policy store backed by an async SQLAlchemy adapter.
sqlalchemy = ["casbin-async-sqlalchemy-adapter>=1.4", "sqlalchemy[asyncio]>=2.0"]
# Durable, dynamic-CRUD policy store backed by MongoDB via Beanie.
# Ideal for Beanie-backed apps that want to avoid pulling in SQLAlchemy.
beanie = ["beanie>=2.0", "motor>=3.0"]

[project.urls]
Homepage   = "https://github.com/edoardoscarpaci/varco"
Repository = "https://github.com/edoardoscarpaci/varco/tree/main/varco_casbin"
Issues     = "https://github.com/edoardoscarpaci/varco/issues"

[tool.uv.sources]
# Resolve sibling packages from the workspace, not PyPI.
varco-core    = { workspace = true }
varco-fastapi = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "casbin-async-sqlalchemy-adapter>=1.4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "testcontainers[postgres]>=4.0",
    "beanie>=2.0",
    "motor>=3.0",
    "testcontainers[mongodb]>=4.0",
]

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varco_casbin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
markers      = [
    "integration: real database required (disabled by default — use -m integration)",
]
filterwarnings = [
    "ignore::DeprecationWarning:httpx",
    "ignore::DeprecationWarning:jwt",
    "ignore::DeprecationWarning:starlette",
    "ignore::DeprecationWarning:pydantic",
]
