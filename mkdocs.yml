site_name: Varco
site_description: Async Python monorepo for event-driven, layered services
docs_dir: technical_docs
site_dir: site

# site_url is required by mike's version switcher — it resolves versions.json
# relative to this URL (Plan 023 / §RL-12-docs). The last path segment is the
# repository slug, resolved to `varco` (§RL-SEC-repo-name).
site_url: https://edoardoscarpaci.github.io/varco/

# DESIGN: mike (commits to a gh-pages branch) over the Actions-artifact model
#   ❌ REJECTED on a hard incompatibility, not a preference (brief 006 §3):
#      mike's entire design is "create commits on a git branch" so it can
#      write versions.json and rewrite the version-switcher's alias pointers
#      (dev/3.0/latest); actions/upload-pages-artifact gives it nowhere to
#      write that file. There is no third option in this ecosystem.
#   ❌ `contents: write` (to push gh-pages) is a broader grant than the
#      artifact model's `pages: write` + `id-token: write`, and the branch
#      grows ~10-20 MB per release (brief 006 Evidence Gap 3) — a non-issue
#      for 3.0.0, revisited at 4.0. Accepted as the price of the only
#      mechanism that actually implements a version switcher today.
extra:
  version:
    provider: mike

# DESIGN: MkDocs Material + mkdocstrings over Sphinx
#   ✅ Consumes the hand-written markdown feature docs natively (no myst-parser).
#   ✅ mkdocstrings/griffe renders the repo's Google-style docstrings out of the box.
#   ✅ Material theme produces a modern, searchable site — the "official" docs.
#   ✅ One site hosts both conceptual feature docs and the auto API reference.
#   ❌ API reference quality is bounded by docstring completeness (the doc agent's job).

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
        - scripts/gen_guide_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_if_no_docstring: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      # DESIGN: custom_fences over a bare pymdownx.superfences block.
      #   ✅ mkdocs-material renders ```mermaid fences as live diagrams client-side.
      #   ❌ Without this, a mermaid fence is just an inert code block.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

