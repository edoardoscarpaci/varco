[project]
name          = "varco-redis"
version       = "3.2.0"
description   = "Redis Pub/Sub event bus backend for varco — RedisEventBus built on redis.asyncio"
authors       = [{ name = "edoardo.scarpaci", email = "edoardo.scarpaci@gmail.com" }]
readme        = "README.md"
license       = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords      = ["fastapi", "redis", "pubsub", "async", "event-bus", "domain-events", "varco"]
classifiers   = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    # Workspace sibling — resolved from the monorepo via the tool.uv.sources table below.
    "varco-core~=3.0",
    # redis>=7 ships asyncio support built-in; no [asyncio] extra needed.
    "redis>=5.0",
    # providify is used directly for @Singleton / @PreDestroy on RedisEventBus
    # and for @Configuration / @Provider in varco_redis.cache / varco_redis.dlq.
    "providify>=2.0.1",
    # pydantic-settings is used directly in varco_redis.config for SettingsConfigDict.
    # It is also a transitive dep via varco-core, but listed explicitly here.
    "pydantic-settings>=2.14.2",
]
[project.urls]
Homepage   = "https://github.com/edoardoscarpaci/varco"
Repository = "https://github.com/edoardoscarpaci/varco/tree/main/varco_redis"
Issues     = "https://github.com/edoardoscarpaci/varco/issues"

[tool.uv.sources]
# Resolve varco-core from the workspace instead of PyPI so editable
# changes are immediately visible without a reinstall.
varco-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    # testcontainers[redis] spins up a real Redis instance via Docker for
    # integration tests.  Marked with @pytest.mark.integration and skipped
    # by default — run with: pytest -m integration
    "testcontainers[redis]>=4.0",
]

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varco_redis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
pythonpath   = ["../testkit"]
markers      = [
    "integration: real Redis instance required (disabled by default — use -m integration)",
    "chaos: kills/pauses/restarts a real container; excluded from -m integration by default — use make chaos-test",
]
filterwarnings = [
    "ignore::DeprecationWarning:httpx",
    "ignore::DeprecationWarning:jwt",
    "ignore::DeprecationWarning:starlette",
    "ignore::DeprecationWarning:pydantic",
]
