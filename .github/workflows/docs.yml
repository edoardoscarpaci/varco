# Versioned documentation via mike, deployed to the gh-pages branch.
#
# Plan 023 / Phase 6, §RL-12-docs. `dev` tracks `main`; `guard` classifies a
# pushed `v*` tag and `release` deploys only for a final (non-pre-release) one.
#
# DESIGN: see mkdocs.yml's own DESIGN comment for why mike (not the Actions
# artifact model) is the only mechanism available — not restated here.
#
# Version naming: `<major>.<minor>` (`3.0`), no `v`, no patch (brief 006 §5)
# — fixed permanently; changing the scheme later 404s every old URL. Aliases:
# `latest` (moves on each final release) and `dev` (tracks `main`). `stable`
# is deliberately not used.
#
# Pre-release tags (`v3.0.0rc1`, `v3.1.0b2`, …) must NEVER move `latest`, so
# a `guard` job classifies the tag and `release` runs only for a final one.
#
# DESIGN: the classification is a bash regex in a job, not a `contains()`
# chain in an `if:`. ✅ It anchors on the WHOLE tag (`^v\d+\.\d+\.\d+$`), so
# only a real final release matches. ❌ It costs one extra ~5s runner job.
# The rejected alternative — `!contains(github.ref, 'a') && …` — was actively
# broken: `github.ref` is `refs/tags/v3.0.0`, and the literal `a` in `tags`
# made the guard false for EVERY tag, so the release job could never run.
# GitHub expressions have no regex, hence the job.
#
# `concurrency: docs-deploy` (shared across both jobs, `cancel-in-progress:
# false`) serializes writes to `gh-pages` — a tag pushed while a `main` push
# is still deploying runs the release deploy AFTER the dev deploy finishes,
# never concurrently.
#
# `fetch-depth: 0` + `uv sync --locked --all-packages --all-extras --group docs`
# are all required: mike needs the full git history to manage the gh-pages
# branch's commits, and mkdocstrings imports the actual packages live to render
# the API reference (brief 006 §6) — a docs-group-only install cannot do that.
#
# ⚠️ `--group docs` is NOT optional, and `--all-extras` does not imply it: extras
# and PEP 735 dependency groups are different mechanisms, and `docs` is not a
# default group, so `mkdocs`/`mike` are simply absent without it (the failure is
# `error: Failed to spawn: mike`). This is the CI equivalent of `make docs-deps`.

name: Docs

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions: {}

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  dev:
    name: Deploy dev docs (main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # mike pushes commits to gh-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install workspace (locked, full — mkdocstrings imports packages live)
        run: uv sync --locked --all-packages --all-extras --group docs
      - name: git identity for mike's commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fetch gh-pages if it exists (first-ever deploy creates it)
        run: git fetch origin gh-pages:gh-pages || true
      - name: mike deploy dev
        run: uv run mike deploy --push dev

  guard:
    name: Classify tag (final vs pre-release)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      is_final: ${{ steps.classify.outputs.is_final }}
      major_minor: ${{ steps.classify.outputs.major_minor }}
    steps:
      - name: Classify the pushed tag
        id: classify
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Anchored on the whole tag: a final release is exactly vX.Y.Z.
          # Anything else (v3.0.0rc1, v3.1.0b2, v4.0.0.dev1) is a pre-release
          # and must not move `latest`.
          if [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "is_final=true" >> "$GITHUB_OUTPUT"
            echo "major_minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is a final release; deploying docs ${BASH_REMATCH[1]}.${BASH_REMATCH[2]} + latest"
          else
            echo "is_final=false" >> "$GITHUB_OUTPUT"
            echo "major_minor=" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is a pre-release; skipping the docs release deploy"
          fi

  release:
    name: Deploy release docs (tag)
    needs: guard
    if: needs.guard.outputs.is_final == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install workspace (locked, full)
        run: uv sync --locked --all-packages --all-extras --group docs
      - name: git identity for mike's commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fetch gh-pages if it exists
        run: git fetch origin gh-pages:gh-pages || true
      - name: mike deploy release + update latest alias
        run: uv run mike deploy --push --update-aliases "${{ needs.guard.outputs.major_minor }}" latest
      - name: mike set-default latest (idempotent)
        run: uv run mike set-default --push latest
