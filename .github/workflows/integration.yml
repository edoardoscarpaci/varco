# CI — integration tests against real brokers via testcontainers.
#
# DESIGN §RL-5-integration (plans/017-ci-green-workflows-and-lint-type-gates.md):
# testcontainers-only, no `services:` blocks.
#   ✅ CI is byte-identical to what a developer runs locally
#      (`make integration-test-clean`) — the same script, the same package
#      list, the same clean-room contract.
#   ✅ Every CI run is a genuine clean-room run — `make integration-test-clean`
#      unsets every `VARCO_TEST_<SERVICE>_URL` override first (Makefile), so
#      the run never silently reuses stale state from a previous job.
#   ✅ Coverage goes to all nine backend packages plus the example suite, in
#      one place (`scripts/integration_tests.sh`) — never duplicated in YAML.
#   ❌ Container startup is serialized inside the job rather than overlapped
#      with a `services:` block's parallel boot. Accepted — this workflow is
#      nightly/main-only, not on the PR critical path.
#
# `services:` blocks are deliberately NOT used here (rejected alternative in
# the design doc above): the repo's conftest fixtures only ever honour the
# namespaced `VARCO_TEST_<SERVICE>_URL` override contract, never a bare
# broker env var name (`KAFKA_BOOTSTRAP_SERVERS`, `REDIS_URL`, `MONGODB_URL`,
# `DATABASE_URL`, ...) — wiring a `services:` block through bare names here
# would silently disarm the "NOT a clean-room run" signal on every CI run,
# which is precisely the run where that signal matters most. Do not
# reintroduce one.
#
# Not a required check for branch protection — `all-green` in test.yml is
# the only one. A nightly integration failure is a BACKLOG/Phase-3 signal,
# not a merge blocker (§RL-5-triggers).
#
# ── `chaos` job (Plan 018 / RT7-ci) ────────────────────────────────────────────
# A second, independent job in this same file — kills/pauses/restarts real
# containers mid-test (§RT7-shape), so it is strictly noisier and slower than
# the `integration` job above and must never share its blast radius.
#   ✅ `if: github.event_name != 'push'` — chaos never runs on `push: main`,
#      only nightly `schedule` and `workflow_dispatch`. A chaos scenario is
#      inherently more failure-prone than a plain broker round-trip (it is
#      *designed* to break something mid-flight); gating it off the push
#      trigger means a chaos flake can never block or even appear on the one
#      trigger a human is watching land on `main`.
#   ✅ Not listed in any `needs:` — `all-green` (test.yml) does not depend on
#      it, and this job does not depend on `integration` either (they are
#      fully independent; a chaos failure must never mask a routine
#      integration regression by cascading `needs:` skips).
#   ✅ Its own `timeout-minutes`, separate from `integration`'s 45 — chaos
#      tests pay real wall-clock cost for `restart()`/`paused()` waits and a
#      slower budget must never silently eat into the integration job's own
#      time-box if they ever shared one.
#   ❌ A second job means the same checkout/setup/`uv sync` preamble is
#      duplicated rather than shared via a reusable workflow/composite
#      action. Accepted — this file has exactly two jobs and reusable
#      workflows are unwarranted machinery for that (§RT7-ci).
#   ❌ **Never promote `chaos` to a required check.** Unlike `integration`
#      (whose promotion is deferred to §RT7-ci's own "after a measured flake
#      rate" gate, tracked in BACKLOG.md's RL-16 row), `chaos` must **never**
#      become one, full stop — it exists to find real bugs under container
#      failure, not to gate merges, and its own tests intentionally exercise
#      genuine race conditions (port remap on restart, black-holed sockets)
#      that are expected to occasionally need operator triage rather than a
#      blocked PR.
#
# ── `concurrency` (Plan 024 / §CONC — design/research/001-github-actions- ──
#    concurrency-semantics.md) ────────────────────────────────────────────
# Newest-merge-wins: when several PRs merge to `main` in quick succession,
# only the newest merge commit's `integration` run reaches completion —
# earlier in-flight/pending runs on the same trigger are cancelled — while
# the nightly `schedule` run and any `workflow_dispatch` run are isolated in
# their own groups and can never be cancelled by, or cancel, a merge.
#
#   group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
#
# | Trigger              | event_name         | ref                  | group |
# |-----------------------|--------------------|-----------------------|-------|
# | merge to `main`        | `push`              | `refs/heads/main`      | `Integration Tests-push-refs/heads/main` |
# | nightly cron            | `schedule`          | `refs/heads/main`      | `Integration Tests-schedule-refs/heads/main` |
# | manual run               | `workflow_dispatch` | selected branch (usually `refs/heads/main`) | `Integration Tests-workflow_dispatch-refs/heads/main` |
#
#   ⚠️ Do NOT copy `test.yml`'s simpler `${{ github.workflow }}-${{ github.ref
#      }}` form here. Research 001 §3: on `push`/`schedule`/`workflow_dispatch`
#      `github.ref` evaluates to `refs/heads/main` for **all three** — a
#      ref-only group would collide across triggers, so a merge landing at
#      05:02 would cancel the nightly run that started at 05:00 *and, with
#      it, the `chaos` job* (the only trigger chaos runs on at all), and
#      symmetrically the nightly cron would cancel an in-flight merge run.
#      `test.yml`'s form is correct *there* only because that workflow has no
#      `schedule`/`workflow_dispatch` trigger to collide with — do not
#      harmonize the two files.
#   ✅ Guarantee (research 001 §2, both readings of an internally
#      inconsistent brief agree on this outcome): the newest merge commit's
#      run is the one that completes; intermediate merge commits inside the
#      same ~45-minute window do NOT get a completed integration run.
#   ❌ A commit whose run was cancelled is never individually retested by
#      this workflow — widens an already-accepted hole (Plan 017
#      §RL-5-triggers: PRs get no integration coverage at all) rather than
#      opening a new one. `main` is still verified at the tip on every merge,
#      plus in full every night; a regression is attributable by bisect, just
#      not automatically.
#   ✅/❌ No cleanup step for containers leaked by a cancelled run (research
#      001 §6/§7: cancellation may not propagate SIGINT/SIGTERM to
#      testcontainers' child processes). Deliberate — both jobs run on
#      GitHub-hosted, ephemeral `ubuntu-latest` runners, which are destroyed
#      (containers and all) at the end of every run regardless of outcome, so
#      there is nothing to leak into. **Reversal trigger:** if this workflow
#      ever moves to a self-hosted or persistent runner, an `if: always()`
#      cleanup step becomes mandatory at that same change.
#   ⚠️ **Couples to any future required-check promotion.** Research 001 §8: a
#      cancelled run's conclusion is neither success nor failure, so a
#      required check that can be cancelled can leave a PR stuck "waiting for
#      status to be reported". `integration`/`chaos` must stay non-required
#      (already repo policy, `:26-28` above) — whoever promotes either job
#      must, in the same change, either drop `cancel-in-progress: true` or
#      accept this failure mode (see BACKLOG.md's RL-16 row).

name: Integration Tests

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install workspace (locked)
        run: uv sync --locked --all-packages --all-extras
      - name: Run integration suite (clean-room)
        run: make integration-test-clean

  chaos:
    name: Chaos tests (container restart/pause)
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install workspace (locked)
        run: uv sync --locked --all-packages --all-extras
      - name: Run chaos suite (clean-room)
        run: make chaos-test-clean
