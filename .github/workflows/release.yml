# CD — build once, publish all ten varco distributions to PyPI over OIDC
# trusted publishing with PEP 740 attestations.
#
# Plan 023 / Phase 5, design section §RL-10-publish / §RL-10-matrix. Replaces the
# never-run, fully-commented-out `publish.yml` from the 0.1.0 era — `git rm`'d in
# the same commit that added this file.
#
# ⚠️ THE FILENAME IS LOAD-BEARING. A PyPI trusted publisher matches on
# owner + repo + workflow *filename* + environment; renaming this file
# invalidates every one of the ten publisher configs (brief 005 §1). Do not
# rename it without re-doing all ten PyPI-side configs.
#
# DESIGN: four jobs — packages (derive matrix) → build (once per package,
# artifact per package) → publish (matrix over the ten names), plus
# release-assets (attach the ten CycloneDX SBOMs to the GitHub Release)
#   ✅ `gh-action-pypi-publish` over `uv publish --trusted-publishing`: emits
#      PEP 740 attestations by default since v1.11.0 with no extra input,
#      and is PyPI's own documented recommendation; `uv publish` emits none
#      (brief 005 §2).
#   ✅ Build-once/publish-later is what the packaging guide *requires* —
#      "building distributions in a publishing job is unsupported" (brief
#      005 §2 citing PyPA's own docs); attestations still work across the
#      job split as long as the publish job holds `id-token: write`.
#   ✅ Package matrix is derived by *executing* `scripts/packages.sh`
#      (Plan 020 / RL-18) — never a hand-written ten-entry YAML list, so an
#      eleventh workspace member needs no edit here.
#   ❌ ~10 extra seconds for the `packages` job. Accepted — same trade
#      `scripts/unit_tests.sh` and `Makefile`'s `PACKAGES` derivation
#      already made.
#
# Two corrections to the brief's own skeleton (brief 005 §4), made explicit
# because the brief's text says the opposite:
#   (1) `packages-dir` MUST be per-package. The brief's own §2 says the
#       action "publishes all .whl and .tar.gz files in the packages-dir",
#       yet its skeleton example passes `dist/` (all ten) on every matrix
#       leg — that would try to upload all ten distributions to each of the
#       ten PyPI projects. Each publish leg here downloads ONLY its own
#       artifact into `dist/`.
#   (2) `environment:` is a JOB-level key, not a step-level one (the
#       brief's skeleton nests it under a step, which is not valid GitHub
#       Actions syntax). Declared at job level here, keyed per matrix leg,
#       for the per-project OIDC scoping brief 005 §1 requires.
#
# Manual, out-of-repo operator steps this workflow depends on (cannot be
# performed by any file in this repo — see
# `design/varco-1-0-release/release-runbook.md`):
#   - Ten GitHub Environments (`pypi-varco-core` … `pypi-varco-casbin`), no
#     deployment-branch restriction.
#   - Ten PyPI trusted-publisher configs: owner `edoardoscarpaci`, repo
#     `varco`, workflow `release.yml`, environment `pypi-<name>`.
#
# ⛔ NEVER select any job in this file as a required status check —
# `release` never runs on `pull_request`, so a required-check selection
# would leave every PR permanently pending (CLAUDE.md §CI).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  packages:
    name: Derive package matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: set-matrix
        name: Build the {dir, name} matrix from scripts/packages.sh
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          dirs = subprocess.run(
              ["bash", "scripts/packages.sh"], capture_output=True, text=True, check=True
          ).stdout.split()
          matrix = [{"dir": d, "name": d.replace("_", "-")} for d in dirs]
          print(f"matrix={json.dumps(matrix)}")
          PY

  build:
    name: Build ${{ matrix.package.name }}
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        package: ${{ fromJson(needs.packages.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Plan 030 / Phase 3 (D5), §D-D5-tooling. One CycloneDX 1.6 document per
      # DISTRIBUTION (Open question 2, decided in scripts/sbom.py's DESIGN
      # block): `uv export --package <name>` yields that package's own resolved
      # dependency subset, so the document does not over-report — an SBOM that
      # lists components the consumer never installs is actively misleading to
      # the regulated downstream it exists to serve.
      #
      # The step also writes `sbom-files` into the package's pyproject.toml, so
      # the wheel built in the NEXT step carries the document at
      # `.dist-info/sboms/` per PEP 770. That mutation is release-time only and
      # is never committed (see .gitignore and the script's DESIGN block).
      #
      # ⚠️ Must run BEFORE `uv build` — hatchling resolves `sbom-files` as
      # literal, existing paths and fails the build if one is missing.
      - name: Generate the CycloneDX SBOM (PEP 770 + Release artifact)
        run: uv run python scripts/sbom.py --packages ${{ matrix.package.dir }}
      - name: Build (uv build --package <dir>, Makefile:227-228's own invocation shape)
        run: uv build --package ${{ matrix.package.dir }} --out-dir ${{ matrix.package.dir }}/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.package.name }}
          path: ${{ matrix.package.dir }}/dist
          if-no-files-found: error
      # A second, separate artifact: the SBOM must NOT land in `dist/`, because
      # the publish job uploads everything in `packages-dir` to PyPI and PyPI
      # rejects a non-distribution file.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.package.name }}
          path: ${{ matrix.package.dir }}/sbom
          if-no-files-found: error

  release-assets:
    name: Attach SBOMs to the GitHub Release
    needs: build
    # Only a real tag push has a Release to attach to; a workflow_dispatch run
    # builds and publishes but has no Release object to decorate.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to upload assets onto the Release — this job only
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          merge-multiple: true
          path: sboms/
      # PyPI does not (yet) serve PEP 770 SBOMs as a discoverable artifact —
      # research 004 §3 — so the GitHub Release is the canonical location for a
      # consumer who wants them without downloading and unzipping ten wheels.
      # See docs/regulatory-posture.md.
      #
      # DESIGN: `gh release upload` over a third-party release action
      #   ✅ No new third-party action to pin, review and keep pinned — this
      #      workflow's threat model is a supply-chain one, and `gh` ships on
      #      every GitHub-hosted runner.
      #   ✅ `--clobber` makes a re-run of a failed leg idempotent, which the
      #      release runbook's "re-run the failed leg, NEVER re-tag" rule needs.
      #   ❌ A shell step instead of a declarative `with:` block. Accepted.
      - name: Upload the ten SBOMs as Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" sboms/*.cdx.json --clobber

  publish:
    name: Publish ${{ matrix.package.name }}
    needs: [packages, build]
    runs-on: ubuntu-latest
    strategy:
      # A mid-matrix failure is NOT rolled back — nine of ten can succeed
      # while one fails. Re-run only the failed leg (workflow_dispatch);
      # NEVER re-tag. See the release runbook's Edge cases.
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.packages.outputs.matrix) }}
    environment:
      name: pypi-${{ matrix.package.name }}
      url: https://pypi.org/project/${{ matrix.package.name }}/
    permissions:
      id-token: write # required for OIDC trusted publishing — this job only
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.package.name }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
