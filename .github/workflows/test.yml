# CI — lint, type-check and unit-test every varco workspace package.
#
# DESIGN §RL-5-shape (plans/017-ci-green-workflows-and-lint-type-gates.md):
# hybrid — one lint job + a 2-leg Python matrix + aggregate, not a per-package
# job fan-out.
#   ✅ 3 jobs + aggregate instead of 16-22; one `uv sync` per Python version
#      feeds all eleven workspace members.
#   ✅ Full per-package picture on every run, from scripts/unit_tests.sh's
#      accumulate-and-summarize behaviour — the per-package failure-isolation
#      argument for a fan-out is honoured without paying for one.
#   ✅ mypy runs once, not 2x11 times — it is version-independent given a
#      pinned python_version in [tool.mypy].
#   ❌ A single red package still turns the whole `unit` leg red in the GitHub
#      UI (no per-package green checkmark). Accepted — the script's own
#      summary names the failing package(s) in the log.
#
# `all-green` is the ONLY required check for branch protection on `main`.
# It asserts on `needs.<job>.result == 'success'` explicitly (not a bare
# `success()`) because a *skipped* upstream job must also fail the aggregate
# (research 002 §5) — a required check must never be able to go permanently
# pending because a matrix leg was skipped.

name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install workspace (locked)
        run: uv sync --locked --all-packages --all-extras
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: mypy
        run: >
          uv run mypy
          varco_core/varco_core varco_kafka/varco_kafka varco_nats/varco_nats
          varco_redis/varco_redis varco_sa/varco_sa varco_beanie/varco_beanie
          varco_memcached/varco_memcached varco_ws/varco_ws
          varco_fastapi/varco_fastapi varco_casbin/varco_casbin
      - name: api surface --check
        run: uv run python scripts/api_surface.py --check
      # Plan 028 / Phase 1 (P1b), Step 12. WARN-ONLY on purpose: the ~2x
      # ceiling headroom in import-budget.json is an assumption about
      # GitHub-runner variance that no source quantifies, so a breach prints
      # and exits 0 today. Plan 028's Step 14 drops `--warn-only` here (and in
      # `make lint`) once >= 10 observations across both matrix legs have been
      # appended to each entry's `observations` array — Step 13.
      - name: import budget --check (warn-only)
        run: uv run python scripts/import_budget.py --check --warn-only
  unit:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install workspace (locked)
        run: uv sync --locked --all-packages --all-extras
      - name: Run all unit test suites
        run: bash scripts/unit_tests.sh
  all-green:
    name: All tests passed
    runs-on: ubuntu-latest
    needs: [lint, unit]
    if: always()
    steps:
      - name: Check all required jobs succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.unit.result }}" != "success" ]]; then
            echo "lint result: ${{ needs.lint.result }}"
            echo "unit result: ${{ needs.unit.result }}"
            echo "One or more required jobs did not succeed (or was skipped)."
            exit 1
          fi
          echo "All required jobs succeeded."
