[project]
name          = "varco-ws"
version       = "3.2.0"
description   = "WebSocket and SSE event bus backends for varco — real-time browser push"
authors       = [{ name = "edoardo.scarpaci", email = "edoardo.scarpaci@gmail.com" }]
readme        = "README.md"
license       = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords      = ["fastapi", "websocket", "sse", "async", "event-bus", "domain-events", "varco"]
classifiers   = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # Workspace sibling — resolved from the monorepo via the tool.uv.sources table below.
    "varco-core~=3.0",
    # Direct importers: varco_ws/sse.py:79, varco_ws/websocket.py:85 — previously
    # satisfied only transitively via varco-core, an undeclared dependency.
    "providify>=2.0.1",
]

[project.urls]
Homepage   = "https://github.com/edoardoscarpaci/varco"
Repository = "https://github.com/edoardoscarpaci/varco/tree/main/varco_ws"
Issues     = "https://github.com/edoardoscarpaci/varco/issues"

[tool.uv.sources]
# Resolve varco-core from the workspace instead of PyPI during development.
varco-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # RT4: real WebSocket/SSE integration harness — a small FastAPI app served by
    # uvicorn on an ephemeral port, driven by real websockets/httpx clients.
    # No testcontainers entry: WebSocketEventBus/SSEEventBus are in-process buses
    # whose "real service" is a locally-bound uvicorn server, not a container.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.28",
    "websockets>=13.0",
]

[build-system]
requires      = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["varco_ws"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]
pythonpath   = ["../testkit"]
# running_server (tests/conftest.py) starts a background uvicorn task and is consumed
# by both fixture-scoped setup and function-scoped tests; without pinning the loop
# scope to "session" uvicorn's task runs in a different event loop than the
# websockets/httpx clients making requests, and requests never complete.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers      = [
    "integration: requires external services (Docker); skipped by default — use -m integration to run",
]
filterwarnings = [
    "ignore::DeprecationWarning:httpx",
    "ignore::DeprecationWarning:jwt",
    "ignore::DeprecationWarning:starlette",
    "ignore::DeprecationWarning:pydantic",
]
